name: Build Android APK (Lite)

on:
  # 手动触发：GitHub 网页 Actions → 本 workflow → Run workflow
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型：release = 独立 APK（内含 JS，装上就能用）；debug = dev client（需连 Metro）'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  # 推到主分支自动构建（不需要可以删掉这段）
  push:
    branches: [lite]

# 同一分支只跑一个，新的 push 会取消旧的
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: npm ci

      # 生成 android/ 原生工程（CNG）。modules/notification-listener 会被 autolinking 自动接进去
      - name: Prebuild native project
        run: npx expo prebuild --platform android --clean --no-install

      # 默认 2G 堆在 RN 0.88 上偶尔 OOM，这里抬到 3G 并限制并发
      - name: Tune Gradle memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          grep -q '^org.gradle.workers.max' android/gradle.properties \
            || echo 'org.gradle.workers.max=2' >> android/gradle.properties
          grep -q '^org.gradle.parallel' android/gradle.properties \
            || echo 'org.gradle.parallel=false' >> android/gradle.properties
          echo "--- inlineModules 属性原始值 ---"
          grep -n "inlineModules" android/gradle.properties || echo "(没有该属性)"

      # GitHub 免费 runner 只有 7G 内存没有 swap，新架构的 CMake/C++ 编译容易被 OOM Kill
      - name: Increase swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build release APK
        if: ${{ (github.event.inputs.variant || 'release') == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain --stacktrace --max-workers=2 -Pexpo.inlineModules.watchedDirectories='[]'

      - name: Build debug APK
        if: ${{ github.event.inputs.variant == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace --max-workers=2 -Pexpo.inlineModules.watchedDirectories='[]'

      # 失败时把 Gradle 报告一起传上去，方便直接发给开发者定位
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          mkdir -p out
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          if [ "$VARIANT" = "debug" ]; then
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            SRC="android/app/build/outputs/apk/release/app-release.apk"
          fi
          echo "APK: $SRC"
          ls -lh "$SRC"
          cp "$SRC" "out/ledger-lite-$VARIANT-r${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ledger-lite-${{ github.event.inputs.variant || 'release' }}-apk
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error
